# GUPPI relay + GUPPI Mobile on Cloudflare (free plan is enough).
# Deploy from this folder with:  npx wrangler deploy
name = "guppi-relay"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Builds the phone app into ./public before each deploy (needs Node 22 + pnpm).
[build]
command = "node build.mjs"

[assets]
directory = "./public"

[vars]
# Only let these pages use the relay (comma separated, e.g. "https://you.github.io").
# The relay's own site is always allowed. Empty means any page may use it, which
# is fine while only you know the address; set it before you share the address,
# or strangers can spend your Worker quota.
ALLOWED_ORIGINS = ""
