# Builds GUPPI 2 desktop downloads and publishes them as a GitHub Release.
#
# • Pull requests that touch guppi2/: check + build installers (downloadable from
#   the run's "Artifacts" section). Nothing is published.
# • Merging to main: builds and, if guppi2/package.json has a version that has
#   not been released yet, publishes GitHub Release v<version> automatically.
#   To ship a new release, bump "version" in guppi2/package.json.
# • You can also push a tag like v2.0.1 or use "Run workflow" to (re)publish.
name: GUPPI 2 desktop build

on:
  pull_request:
    paths: ['guppi2/**', '.github/workflows/guppi2-release.yml']
  push:
    branches: [main]
    paths: ['guppi2/**', '.github/workflows/guppi2-release.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.0.0 (leave empty to use guppi2/package.json)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: guppi2-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Run JavaScript actions on Node 24 (silences the Node 20 deprecation warning).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: guppi2
    shell: bash

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide version and whether to publish
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"; PUBLISH=true
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            VERSION="${INPUT_VERSION:-$PKG_VERSION}"; PUBLISH=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            VERSION="$PKG_VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
              PUBLISH=false
              echo "::notice::v$VERSION is already released. Bump \"version\" in guppi2/package.json to publish a new release."
            else
              PUBLISH=true
            fi
          else
            VERSION="$PKG_VERSION"; PUBLISH=false
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then echo "::error::Invalid version: $VERSION"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION · publish=$PUBLISH"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: guppi2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  package:
    name: Package (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: package:win
            files: |
              guppi2/release/*.exe
          - name: Linux
            os: ubuntu-latest
            script: package:linux
            files: |
              guppi2/release/*.AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: guppi2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Set app version
        run: npm pkg set version="${{ needs.check.outputs.version }}"

      # --publish never: electron-builder only builds; the release job publishes.
      - name: Build installers
        run: pnpm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: GUPPI-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [check, package]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GUPPI v${{ needs.check.outputs.version }}
          make_latest: true
          generate_release_notes: true
          body: |
            ## Download

            | Platform | File |
            | --- | --- |
            | **Windows (recommended)** | `GUPPI-Setup-${{ needs.check.outputs.version }}.exe`: installer with Start-menu and desktop shortcuts |
            | Windows, no install | `GUPPI-Portable-${{ needs.check.outputs.version }}.exe`: run from anywhere |
            | Linux | `GUPPI-${{ needs.check.outputs.version }}-x86_64.AppImage`: `chmod +x`, then run |

            These builds are not code-signed yet, so Windows SmartScreen may say "Windows protected your PC". Click **More info → Run anyway**.

            Connect with your personal API key from neumann-probe.net, or click **Explore with the simulator** to try GUPPI offline.
          files: dist/*
          fail_on_unmatched_files: true
