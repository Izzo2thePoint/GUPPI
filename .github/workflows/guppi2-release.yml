# Builds GUPPI 2 desktop downloads and publishes them as a GitHub Release.
#
# • Pull requests that touch guppi2/: check + build installers (downloadable from
#   the run's "Artifacts" section when the account has artifact storage left;
#   the build still passes without it). Nothing is published.
# • Merging to main: builds and, if guppi2/package.json has a version that has
#   not been released yet, publishes GitHub Release v<version> automatically.
#   To ship a new release, bump "version" in guppi2/package.json.
# • You can also push a tag like v2.0.1 or use "Run workflow" to (re)publish.
#
# Installers go straight onto the release (a draft until every platform has
# uploaded), so publishing never depends on Actions artifact storage. The
# publish step adds SHA256SUMS.txt and lists the checksums in the release notes.
#
# Windows code signing is optional and switches on by itself when one of these
# sets of repository secrets exists (Settings → Secrets and variables → Actions):
# • Azure Trusted Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#   AZURE_SIGNING_ENDPOINT (e.g. https://eus.codesigning.azure.net),
#   AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE, AZURE_SIGNING_PUBLISHER
#   (the certificate subject, e.g. "CN=Your Name").
# • A code-signing certificate: WIN_CSC_LINK (the .pfx, base64) and
#   WIN_CSC_KEY_PASSWORD.
# Without them the builds are unsigned and SmartScreen warns on first run.
#
# Actions are pinned to commit hashes; Dependabot (.github/dependabot.yml)
# proposes updates.
name: GUPPI 2 desktop build

on:
  pull_request:
    paths: ['guppi2/**', 'relay/**', '.github/workflows/guppi2-release.yml']
  push:
    branches: [main]
    paths: ['guppi2/**', '.github/workflows/guppi2-release.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.0.0 (leave empty to use guppi2/package.json)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: guppi2-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Run JavaScript actions on Node 24 (silences the Node 20 deprecation warning).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: guppi2
    shell: bash

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Decide version and whether to publish
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            # A tag whose release is already published is not rebuilt (for example a tag
            # re-pushed after a history rewrite). "Run workflow" still republishes on demand.
            if [[ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
              PUBLISH=false
              echo "::notice::v$VERSION is already published, so this tag push builds nothing."
            else
              PUBLISH=true
            fi
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            VERSION="${INPUT_VERSION:-$PKG_VERSION}"; PUBLISH=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            VERSION="$PKG_VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
              PUBLISH=false
              echo "::notice::v$VERSION is already released. Bump \"version\" in guppi2/package.json to publish a new release."
            else
              PUBLISH=true
            fi
          else
            VERSION="$PKG_VERSION"; PUBLISH=false
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then echo "::error::Invalid version: $VERSION"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION · publish=$PUBLISH"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: guppi2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  draft:
    name: Draft GitHub Release
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create the draft release (or reuse one for this version)
        run: |
          cat > body.md <<EOF
          ## Download

          | Platform | File |
          | --- | --- |
          | **Windows (recommended)** | \`GUPPI-Setup-$VERSION.exe\`: installer with Start-menu and desktop shortcuts |
          | Windows, no install | \`GUPPI-Portable-$VERSION.exe\`: run from anywhere |
          | Linux | \`GUPPI-$VERSION-x86_64.AppImage\`: \`chmod +x\`, then run |
          | Scripts & AI agents | \`guppi-cli-$VERSION.tgz\`: \`npm install -g\` it for the \`guppi\` command line and the \`guppi-mcp\` server ([guide](https://github.com/Izzo2thePoint/GUPPI/blob/main/docs/AGENT-API.md)) |

          On Linux the AppImage needs FUSE (\`sudo apt install libfuse2\` on Ubuntu and Debian), or run it with \`--appimage-extract-and-run\`.

          If Windows SmartScreen says "Windows protected your PC", click **More info → Run anyway**. Every file is built by GitHub Actions from the tagged commit; the checksums at the end of these notes and in \`SHA256SUMS.txt\` let you verify a download.

          Connect with your personal API key from neumann-probe.net, or click **Explore with the simulator** to try GUPPI offline.

          **iPhone or Android:** in GUPPI open **Settings → Phone & agent access**, switch on remote access and scan the QR code with your phone's camera. Then add GUPPI Mobile to your home screen: on iPhone tap **Share → Add to Home Screen** in Safari; on Android tap Chrome's menu → **Add to Home screen** (or **Install app**).
          EOF
          if gh release view "v$VERSION" --json isDraft >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; installers will be replaced on it."
          else
            gh release create "v$VERSION" --draft --title "GUPPI v$VERSION" --target "$GITHUB_SHA" --notes-file body.md
          fi

  package:
    name: Package (${{ matrix.name }})
    needs: [check, draft]
    # Runs after the draft when publishing, and on its own for pull requests.
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: package:win
            glob: release/*.exe
            files: |
              guppi2/release/*.exe
          - name: Linux
            os: ubuntu-latest
            script: package:linux
            glob: release/*.AppImage release/guppi-cli-*.tgz
            files: |
              guppi2/release/*.AppImage
              guppi2/release/guppi-cli-*.tgz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: guppi2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Set app version
        run: npm pkg set version="${{ needs.check.outputs.version }}"

      # Windows signing switches on only when the secrets exist (see the top of this file).
      - name: Decide code signing
        id: signing
        if: matrix.name == 'Windows'
        env:
          AZ_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZ_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZ_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZ_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
          AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          AZ_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          AZ_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CSC_LINK_IN: ${{ secrets.WIN_CSC_LINK }}
          CSC_PASSWORD_IN: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$AZ_ENDPOINT" ] && [ -n "$AZ_ACCOUNT" ] && [ -n "$AZ_PROFILE" ] && [ -n "$AZ_TENANT" ] && [ -n "$AZ_CLIENT" ] && [ -n "$AZ_SECRET" ]; then
            echo "Signing with Azure Trusted Signing."
            {
              echo "AZURE_TENANT_ID=$AZ_TENANT"; echo "AZURE_CLIENT_ID=$AZ_CLIENT"; echo "AZURE_CLIENT_SECRET=$AZ_SECRET"
            } >> "$GITHUB_ENV"
            echo "args=-c.win.azureSignOptions.endpoint=$AZ_ENDPOINT -c.win.azureSignOptions.codeSigningAccountName=$AZ_ACCOUNT -c.win.azureSignOptions.certificateProfileName=$AZ_PROFILE -c.win.azureSignOptions.publisherName=\"$AZ_PUBLISHER\"" >> "$GITHUB_OUTPUT"
          elif [ -n "$CSC_LINK_IN" ]; then
            echo "Signing with the certificate in WIN_CSC_LINK."
            { echo "WIN_CSC_LINK=$CSC_LINK_IN"; echo "WIN_CSC_KEY_PASSWORD=$CSC_PASSWORD_IN"; } >> "$GITHUB_ENV"
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No signing secrets, so the Windows builds are unsigned."
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      # --publish never: electron-builder only builds; the release job publishes.
      - name: Build installers
        run: pnpm run ${{ matrix.script }} ${{ steps.signing.outputs.args }}

      # The command line and MCP server (no dependencies) ride along with the Linux build.
      - name: Pack the guppi command line
        if: matrix.name == 'Linux'
        run: |
          npm --prefix cli pkg set version="${{ needs.check.outputs.version }}"
          npm pack ./cli --pack-destination release

      - name: Attach installers to the release
        if: needs.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.check.outputs.version }}" ${{ matrix.glob }} --clobber

      # Downloads for pull requests. Artifact storage is a per-account quota, so
      # running out of it must not fail the build.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.check.outputs.publish != 'true'
        continue-on-error: true
        with:
          name: GUPPI-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [check, draft, package]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check every installer is attached
        run: |
          gh release view "v$VERSION" --json assets --jq '.assets[].name' | tee assets.txt
          for f in "GUPPI-Setup-$VERSION.exe" "GUPPI-Portable-$VERSION.exe" "GUPPI-$VERSION-x86_64.AppImage" "guppi-cli-$VERSION.tgz"; do
            grep -qx "$f" assets.txt || { echo "::error::$f is missing from the release"; exit 1; }
          done

      # SHA-256 of every file, as a downloadable list and at the end of the notes,
      # so a player can check a download: `sha256sum -c SHA256SUMS.txt` on Linux,
      # `certutil -hashfile GUPPI-Setup-x.y.z.exe SHA256` on Windows.
      - name: Add checksums and publish
        run: |
          mkdir -p dl && gh release download "v$VERSION" --dir dl
          (cd dl && sha256sum *) | tee SHA256SUMS.txt
          gh release upload "v$VERSION" SHA256SUMS.txt --clobber
          gh release view "v$VERSION" --json body --jq .body > body.md
          {
            printf '\n## Checksums (SHA-256)\n\n```\n'
            cat SHA256SUMS.txt
            printf '```\n'
          } >> body.md
          gh release edit "v$VERSION" --notes-file body.md --draft=false --latest
